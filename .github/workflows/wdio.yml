name: WDIO tests

# Triggered every 10 minutes by cron-job.org via the workflow_dispatch API.
# GitHub's own schedule trigger was removed: it is best-effort (delays/skips)
# and would double the Actions-minutes usage on top of the external cron.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run WDIO tests
        run: npm test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wdio-logs
          path: '*.log'
          if-no-files-found: ignore
